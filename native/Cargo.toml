[package]
name = "constellation-lab-launcher"
version = "0.4.1"
edition = "2024"
license = "MIT"

[[bin]]
name = "agent-experiment-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security"] }
