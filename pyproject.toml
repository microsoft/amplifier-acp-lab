[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = {file = "LICENSE"}
readme = "README.md"
name = "agent-experiment-lab"
version = "0.4.0"
description = "Repeatable collaboration experiments through ordinary ACP endpoints"
requires-python = ">=3.11"
dependencies = ["agent-client-protocol @ git+https://github.com/agentclientprotocol/python-sdk.git@9853d8b514d6340000bcbd01ec07808436db80cf"]

[project.scripts]
agent-experiment-lab = "experiment_lab.cli:main"

[tool.setuptools.packages.find]
include = ["experiment_lab*"]

[project.urls]
Repository = "https://github.com/microsoft/amplifier-acp-lab"
